baseURL = 'https://iamkaran.github.io'
locale = 'en-us'
title = "karan's devlogs"
theme = "enervoid"

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 10

  [[menus.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 30

[params]
  avatar = "profile.jpg"

  [[params.socials]]
      link = "https://github.com/iamkaran"
      icon = "devicon-github-original"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$','$$'], ['\\[','\\]']]
        inline = [['$','$'], ['\\(','\\)']]

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

    [markup.tableOfContents]
      startLevel = 1
      endLevel = 4
      ordered = false

[markup.highlight]
  noClasses = true
  codeFences = true
  guessSyntax = true
  tabWidth = 4
  style = "monokai"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
